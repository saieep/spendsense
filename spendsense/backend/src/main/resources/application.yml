spring:
  application:
    name: spendsense-backend
  datasource:
    url: jdbc:sqlite:./data/expenses.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

spendsense:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:spendsense-dev-secret-change-in-production-min-32-chars}
    expiration-ms: 86400000
  gemini:
    enabled: false
    dev-mode: false
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    categorize-max-tokens: 200
    insights-max-tokens: 2048
    daily-request-limit: 100
    min-request-interval-ms: 4000

logging:
  level:
    com.spendsense: INFO
